name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  linux-x86_64:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install the isolated tmux test runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux

      - name: Run the complete offline suite
        run: ./test-all.sh

      - name: Install the static Linux target
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get install --yes musl-tools

      - name: Build the portable release archive
        env:
          SLURM_LOG_TARGET: x86_64-unknown-linux-musl
        run: ./package.sh dist/slurm-log-linux-x86_64.tar.gz

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/slurm-log-linux-x86_64.tar.gz
          dist/slurm-log-linux-x86_64.tar.gz.sha256
          --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
