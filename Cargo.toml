[package]
name = "slurm-log"
version = "0.1.8"
edition = "2024"
description = "Fast, owner-filtered Slurm log browser"
license = "MIT"

[dependencies]
anyhow = "1.0"
crossterm = { version = "0.29", default-features = false, features = ["bracketed-paste", "events", "windows"] }
fs2 = "0.4"
rmp-serde = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shell-words = "1.1"
signal-hook = "0.3"
time = { version = "0.3", default-features = false, features = ["std", "formatting", "parsing", "local-offset"] }
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
