[package]
name = "slurm-log"
version = "0.3.0"
edition = "2024"
description = "Fast, owner-filtered Slurm log browser"
license = "MIT"

[dependencies]
anyhow = "1.0"
crossterm = { version = "0.29", default-features = false, features = ["bracketed-paste", "events", "windows"] }
ed25519-compact = { version = "=2.1.1", default-features = false, features = ["std"] }
fs2 = "0.4"
getrandom = "0.4"
regex = { version = "1.11", default-features = false, features = ["std", "perf"] }
rmcp = { version = "=3.1.2", default-features = false, features = ["server", "macros", "schemars", "transport-io"] }
rmp-serde = "1.3"
rustix = { version = "0.38", features = ["fs", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
shell-words = "1.1"
signal-hook = "0.3"
time = { version = "0.3", default-features = false, features = ["std", "formatting", "parsing", "local-offset"] }
tokio = { version = "1.47", features = ["rt", "io-std", "io-util", "time", "sync"] }
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
